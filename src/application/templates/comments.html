<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WorkPulse – Комментарии</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
</head>
<body>

<div id="notification"></div>

<div class="form">
    <h3>Навигация</h3>
    <div class="nav">
        <a href="/">Вход</a>
        <a href="/users">Пользователи</a>
        <a href="/teams">Команды</a>
        <a href="/tasks">Задачи</a>
        <a href="/evaluations">Оценки</a>
        <a href="/meetings">Митинги</a>
        <a href="/calendar">Календарь</a>
    </div>
    <div id="status"></div>
</div>

<div class="form">
    <h3>💬 Комментировать задачу</h3>
    <input id="comment_task_id" placeholder="CommentCreate.task_id (int)">
    <br>
    <textarea id="comment_text" placeholder="CommentCreate.text"></textarea>
    <br>
    <button type="button" onclick="commentTask()">Добавить комментарий</button>
    <pre id="comment_output"></pre>

    <h4>Комментарии по задаче</h4>
    <input id="comment_task_id_get" placeholder="task_id">
    <br>
    <button type="button" onclick="loadCommentsByTask()">Комментарии задачи</button>
    <pre id="comments_task_output"></pre>
</div>

<script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
