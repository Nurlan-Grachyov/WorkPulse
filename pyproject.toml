[project]
name = "workpulse"
version = "0.1.0"
description = ""
authors = [
    {name = "Nurlan",email = "nurlan.grachyov@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flake8 (>=7.3.0,<8.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "fastapi[standart] (>=0.128.0,<0.129.0)",
    "fastapi[email] (>=0.128.0,<0.129.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.3,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pydantic[email] (>=2.12.5,<3.0.0)",
    "passlib (>=1.7.4,<2.0.0)",
    "fastapi-users[sqlalchemy] (>=15.0.3,<16.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-slugify (>=8.0.4,<9.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.isort]
profile = "black"
line_length = 119