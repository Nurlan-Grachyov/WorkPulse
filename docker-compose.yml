services:
  db:
    image: postgres:16-alpine
    container_name: workpulse-db
    environment:
      POSTGRES_DB: workpulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1856513
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  migrations:
    build: .
    container_name: workpulse-migrations
    depends_on:
      - db
    env_file:
      - .env
    command: [ "alembic", "-c", "alembic.ini", "upgrade", "head" ]
    restart: "no"

  web:
    build: .
    container_name: workpulse-web
    depends_on:
      - db
      - migrations
    env_file:
      - .env
    ports:
      - "3000:8001"
    restart: unless-stopped

volumes:
  postgres_data:
