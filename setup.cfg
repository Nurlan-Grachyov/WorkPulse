[coverage:report]
omit = src/application/main.py, src/tests/*, src/application/schemas/*, src/application/migrations/*, src/infrastructure/db/*, src/domain/*, src/application/routers/*

[tool:pytest]
asyncio_mode = auto
addopts = --ignore=src/application/main.py
pythonpath = . src
filterwarnings =
    ignore::DeprecationWarning:passlib.*argon2
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning