[coverage:report]
omit = app/main.py, app/tests/*, app/database.py, app/models/*, app/schemas/*

[tool:pytest]
asyncio_mode = auto
addopts = --ignore=app/main.py
pythonpath = . app
filterwarnings =
    ignore::DeprecationWarning:passlib.*argon2
    ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning